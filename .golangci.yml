run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  goconst:
    min-len: 3
    min-occurrences: 3
  
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - unnamedResult
      - whyNoLint
  
  gofmt:
    simplify: true
  
  goimports:
    local-prefixes: github.com/Avalanche-io/c4
  
  golint:
    min-confidence: 0.8
  
  govet:
    check-shadowing: true
    enable-all: true
  
  misspell:
    locale: US
  
  nolintlint:
    allow-leading-space: false
    require-explanation: true
    require-specific: true
  
  revive:
    min-confidence: 0.8
  
  staticcheck:
    go: "1.21"
  
  unused:
    go: "1.21"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - varcheck
    - structcheck
    - deadcode
    - misspell
    - unconvert
    - gofmt
    - goimports
    - goconst
    - gocritic
    - revive
    - nolintlint
  
  disable:
    - maligned  # deprecated
    - scopelint # deprecated
    - interfacer # deprecated

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
    
    # Exclude known linter issues
    - path: cmd/c4/c4.go
      linters:
        - gocritic
      text: "exitAfterDefer"
  
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default-severity: error