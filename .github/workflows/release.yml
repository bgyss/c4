name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.21'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Run tests
      run: go test -v ./...
    
    - name: Build binaries
      run: |
        # Build for multiple platforms
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o c4-linux-amd64 ./cmd/c4
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o c4-linux-arm64 ./cmd/c4
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o c4-darwin-amd64 ./cmd/c4
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o c4-darwin-arm64 ./cmd/c4
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o c4-windows-amd64.exe ./cmd/c4
        GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o c4-windows-arm64.exe ./cmd/c4
        
        # Create checksums
        sha256sum c4-* > checksums.txt
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          c4-linux-amd64
          c4-linux-arm64
          c4-darwin-amd64
          c4-darwin-arm64
          c4-windows-amd64.exe
          c4-windows-arm64.exe
          checksums.txt
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: avalancheio/c4
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max