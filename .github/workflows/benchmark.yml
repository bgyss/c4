name: Benchmark

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM UTC

env:
  GO_VERSION: '1.21'

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-
    
    - name: Run benchmarks
      run: |
        go test -bench=. -benchmem -run=^$ ./... | tee benchmark_results.txt
    
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'go'
        output-file-path: benchmark_results.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        alert-threshold: '200%'
        comment-on-alert: true
        fail-on-alert: true
        benchmark-data-dir-path: dev/bench
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: benchmark_results.txt

  memory-benchmark:
    name: Memory Usage Benchmarks
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Install benchstat
      run: go install golang.org/x/perf/cmd/benchstat@latest
    
    - name: Run memory benchmarks
      run: |
        # Run benchmarks multiple times for statistical analysis
        for i in {1..5}; do
          go test -bench=BenchmarkMemoryAllocation -benchmem -run=^$ ./... >> memory_bench_$i.txt
        done
        
        # Compare results
        benchstat memory_bench_*.txt > memory_comparison.txt
    
    - name: Upload memory benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: memory-benchmark-results
        path: |
          memory_bench_*.txt
          memory_comparison.txt

  cross-platform-benchmark:
    name: Cross-Platform Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Run core benchmarks
      run: |
        go test -bench=BenchmarkIdentify -benchmem -run=^$ ./... | tee benchmark_${{ matrix.os }}.txt
    
    - name: Upload platform-specific results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-${{ matrix.os }}
        path: benchmark_${{ matrix.os }}.txt

  regression-test:
    name: Performance Regression Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Check out base
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
    
    - name: Check out PR
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Install benchstat
      run: go install golang.org/x/perf/cmd/benchstat@latest
    
    - name: Run base benchmarks
      run: |
        cd base
        go test -bench=. -benchmem -count=5 -run=^$ ./... > ../base_bench.txt
    
    - name: Run PR benchmarks
      run: |
        cd pr
        go test -bench=. -benchmem -count=5 -run=^$ ./... > ../pr_bench.txt
    
    - name: Compare benchmarks
      run: |
        benchstat base_bench.txt pr_bench.txt > comparison.txt
        echo "## Benchmark Comparison" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat comparison.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    
    - name: Comment PR
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const comparison = fs.readFileSync('comparison.txt', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📊 Benchmark Results\n\n\`\`\`\n${comparison}\n\`\`\``
          });