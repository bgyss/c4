name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  GO_VERSION: '1.24'

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.23', '1.24']
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        clean: true
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: false
    
    - name: Clear Go cache for CI consistency
      run: |
        go clean -cache -testcache
        echo "Cleared Go caches for clean CI run"
    
    - name: Download dependencies
      run: go mod download
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Debug environment (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        echo "Go version: $(go version)"
        echo "OS: $(uname -a)"
        echo "Go env GOOS: $(go env GOOS)"
        echo "Go env GOARCH: $(go env GOARCH)"
        echo "Working directory: $(pwd)"
        ls -la
      shell: bash
    
    - name: Run tests
      run: |
        echo "Running tests on ${{ matrix.os }} with Go ${{ matrix.go-version }}"
        echo "Cleaning test cache for consistent results"
        go clean -testcache
        echo "Starting test run with race detection"
        go test -v -race -coverprofile=coverage.out -timeout=10m ./...
      shell: bash
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Build CLI
      run: go build -v -o c4${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/c4
    
    - name: Test CLI basic functionality
      shell: bash
      run: |
        echo "test content" | ./c4${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: c4-${{ matrix.os }}
        path: c4${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest
    
    - name: Run Gosec Security Scanner
      run: gosec -no-fail -fmt sarif -out results.sarif ./...
    
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Run tests with coverage
      run: |
        go test -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 75.0" | bc -l) )); then
          echo "Coverage $COVERAGE% is below threshold of 75%"
          exit 1
        fi
        echo "Coverage check passed: $COVERAGE%"
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Check for vulnerabilities
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
    
    - name: Check for outdated dependencies
      run: |
        go list -u -m all

  nix-test:
    name: Nix Build Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Enable Nix flakes
      run: |
        echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
    
    - name: Build with Nix
      run: |
        echo "Building with Nix..."
        nix build --print-build-logs
        echo "Nix build completed successfully"
    
    - name: Test Nix build
      run: |
        echo "Testing Nix-built binary..."
        if [[ ! -f ./result/bin/c4 ]]; then
          echo "Error: c4 binary not found in ./result/bin/"
          ls -la ./result/bin/ || echo "result/bin directory not found"
          exit 1
        fi
        echo "test content" | ./result/bin/c4
        echo "Nix build test completed successfully"